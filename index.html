<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Three Families, One Summer — Destination Brochure</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231D4237'/%3E%3Ccircle cx='44' cy='20' r='7' fill='%23E0A33E'/%3E%3Cpath d='M6 50l14-20 10 13 8-9 20 16z' fill='%23F1EFE6'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    color-scheme: light dark;
    --dark:#1D4237; --accent:#B92D63; --sun:#E0A03A;

    --page:#E9E7DC;
    --text:#0E211B;
    --text-2:rgba(14,33,27,.82);
    --text-3:rgba(14,33,27,.66);
    --rule:rgba(14,33,27,.18);
    --panel:#DAD8C9;
    --price:#6E2233;
    --facts-bg:#0E211B;

    --on-band:#F1EFE6;
    --on-band-2:rgba(241,239,230,.88);
    --on-band-3:rgba(241,239,230,.72);

    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --page:#141510;
      --text:#EDEBE1;
      --text-2:rgba(237,235,225,.86);
      --text-3:rgba(237,235,225,.68);
      --rule:rgba(237,235,225,.22);
      --panel:rgba(237,235,225,.09);
      --price:#E6A9B6;
      --facts-bg:#0A0B07;
    }
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--page);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.6}
  img{max-width:100%;display:block}

  h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1;margin:0;color:var(--text)}
  h2{font-size:clamp(1.7rem,4.4vw,2.6rem);letter-spacing:-.015em}
  h3{font-size:1.2rem}
  p{margin:0 0 1em;color:var(--text-2)}
  p:last-child{margin-bottom:0}

  .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}

  .masthead{background:var(--dark);padding-top:22px;position:sticky;top:0;z-index:900;box-shadow:0 1px 0 rgba(0,0,0,.35);transition:background .35s ease}
  .brandline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:16px}
  .brandline b{font-family:var(--serif);font-weight:600;font-size:1.16rem;color:var(--on-band)}
  .brandline span{font-size:.86rem;color:var(--on-band-3)}

  .tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font-family:var(--sans);font-size:.95rem;font-weight:500;color:var(--on-band-3);background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 16px 12px;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--on-band)}
  .tab[aria-selected="true"]{color:var(--on-band);border-bottom-color:var(--sun)}
  .tab.ghost{font-style:italic}
  .tab:focus-visible{outline:2px solid var(--sun);outline-offset:-3px}

  .hero{background:var(--dark);padding:clamp(34px,7vw,62px) 0 0}
  .hero h1{font-size:clamp(2.5rem,8vw,4.6rem);line-height:.98;letter-spacing:-.03em;margin:0 0 18px;color:var(--on-band)}
  .hero .lede{max-width:34em;font-size:clamp(1.02rem,2.3vw,1.2rem);color:var(--on-band-2);margin-bottom:30px}

  .section-figure{margin:0;padding-bottom:8px}
  .section-figure figcaption{font-size:.88rem;color:var(--on-band-3);padding:12px 0 26px;max-width:46em}
  .xsec{width:100%;height:auto;overflow:visible}

  .facts{background:var(--facts-bg)}
  .facts .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(241,239,230,.22);padding:0}
  .fact{background:var(--facts-bg);padding:20px clamp(14px,2.4vw,26px)}
  .fact dt{font-size:.82rem;color:var(--on-band-3);margin-bottom:4px}
  .fact dd{margin:0;font-family:var(--serif);font-size:1.16rem;font-weight:600;line-height:1.2;color:var(--on-band)}

  section.band{padding:clamp(44px,7vw,80px) 0;background:var(--page)}
  section.band + section.band{border-top:1px solid var(--rule)}
  .band.dark{background:var(--dark);border-top:0}
  .band.dark h2,.band.dark h3{color:var(--on-band)}
  .band.dark p,.band.dark li,.band.dark td,.band.dark th,.band.dark .intro{color:var(--on-band-2)}
  .intro{max-width:40em;margin-top:14px;color:var(--text-2)}

  .maptools{display:flex;gap:8px;margin:26px 0 10px;flex-wrap:wrap;align-items:center}
  .maptools .lbl{font-size:.87rem;color:var(--text-3);margin-right:4px}
  .mbtn{font-family:var(--sans);font-size:.85rem;font-weight:500;background:transparent;color:var(--text);border:1px solid var(--rule);border-radius:2px;padding:6px 13px;cursor:pointer}
  .mbtn[aria-pressed="true"]{background:var(--text);color:var(--page);border-color:var(--text)}
  .mbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .gmap{width:100%;height:min(62vh,470px);border:1px solid var(--rule);display:block;background:var(--panel)}
  .pinmap{height:min(62vh,470px);margin-top:12px;background:var(--panel);border:1px solid var(--rule)}
  .leaflet-container{font-family:var(--sans)}
  .pin-pop{color:#222}
  .pin-pop b{font-family:var(--serif);font-size:1.05rem;display:block;margin-bottom:3px;color:#111}
  .pin-pop small{color:#555;display:block;margin-bottom:6px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:.88rem;color:var(--text-2)}
  .legend i{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:7px}
  .caption{font-size:.88rem;color:var(--text-3);margin-top:10px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:28px 24px;margin-top:34px}
  .card figure{margin:0}
  .shot{aspect-ratio:4/3;background:rgba(241,239,230,.14);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .shot img{width:100%;height:100%;object-fit:cover}
  .shot .fallback{font-family:var(--serif);font-size:.95rem;text-align:center;padding:0 18px;color:var(--on-band-3)}
  .card h3{margin:14px 0 6px}
  .card p{font-size:.95rem}
  .tagline{font-size:.83rem;color:var(--sun);margin-bottom:2px;font-weight:500}

  .bases{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));margin-top:32px;border-top:1px solid var(--rule)}
  .base{padding:24px 26px 24px 0;border-bottom:1px solid var(--rule)}
  .bases .base + .base{border-left:1px solid var(--rule);padding-left:26px}
  .base h3{margin-bottom:8px}
  .base p{font-size:.95rem}
  .base .price{font-family:var(--serif);font-size:1.02rem;color:var(--price);margin-top:10px}

  .days{margin-top:34px;border-left:2px solid rgba(241,239,230,.35)}
  .day{display:grid;grid-template-columns:78px 1fr;gap:0 22px;padding:16px 0 16px 22px}
  .day + .day{border-top:1px solid rgba(241,239,230,.2)}
  .day .n{font-family:var(--serif);font-size:1.45rem;font-weight:600;color:var(--sun);line-height:1;padding-top:2px}
  .day .n small{display:block;font-family:var(--sans);font-size:.74rem;color:var(--on-band-3);font-weight:400;margin-top:4px}
  .day h3{font-size:1.08rem;margin-bottom:5px}
  .day p{font-size:.95rem}

  table{width:100%;border-collapse:collapse;margin-top:28px;font-size:.96rem}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  th,td{text-align:left;padding:13px 12px 13px 0;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--text-2)}
  th{font-weight:700;font-size:.85rem;color:var(--text-3)}
  td strong{color:var(--text)}
  td.num{text-align:right;font-family:var(--serif);font-weight:600;white-space:nowrap;padding-right:0;color:var(--text)}
  tr.total td{border-bottom:0;border-top:2px solid var(--text);font-size:1.05rem;padding-top:15px}
  tr.total td.num{font-size:1.2rem;color:var(--price)}
  .note{font-size:.9rem;color:var(--text-2);margin-top:14px;max-width:46em}

  .compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:24px;margin-top:32px}
  .opt{border-top:3px solid var(--rule);padding-top:16px}
  .opt.pick{border-top-color:var(--accent)}
  .opt h3{margin-bottom:8px}
  .opt p{font-size:.94rem}

  .twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px 44px;margin-top:30px}
  .twocol h3{margin-bottom:10px}
  .twocol ul{margin:0;padding-left:1.1em;font-size:.95rem}
  .twocol li{margin-bottom:8px}

  .empty{padding:clamp(60px,12vw,120px) 0;text-align:center}
  .empty p{max-width:30em;margin:14px auto 0}

  footer{background:var(--facts-bg);color:var(--on-band-3);padding:34px 0;font-size:.86rem}
  [hidden]{display:none !important}

  @media (max-width:760px){
    .facts .wrap{grid-template-columns:repeat(2,1fr)}
    .bases .base + .base{border-left:0;padding-left:0}
    .base{padding-right:0}
    .day{grid-template-columns:58px 1fr;padding-left:16px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="brandline">
      <b>Three families, one summer</b>
      <span>Destination shortlist &middot; 12 travellers, ages 10&ndash;18</span>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<main id="panels"></main>

<footer>
  <div class="wrap">
    Costs are planning estimates and move with booking timing. Photographs from Wikimedia Commons; maps &copy; Google and &copy; OpenStreetMap contributors.
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* Add a destination: push one object into DESTINATIONS.
   Pin an exact photo to a card with  photo:"https://..."  */

const DESTINATIONS = [

/* ============================ MADEIRA ============================ */
{
  id:"madeira", tab:"Madeira", title:"Madeira",
  theme:{dark:"#1D4237", accent:"#B92D63", sun:"#E0A03A"},
  lede:"An Atlantic island that climbs from sea level to 1,818 metres in the space of a short drive. Whale boats in the morning, a cloud-forest water channel in the afternoon, twelve people around one table at night.",
  facts:[["Best window","Late June – early July"],["Length","8–10 days, one base"],
         ["Door to door","8–12 hrs via Lisbon"],["Per person","$1,850 – $3,100"]],
  hero:{type:"profile"},
  gmap:{q:"Madeira, Portugal", z:9},
  map:{center:[32.75,-16.96], zoom:10},
  pinKinds:{base:{color:"#B92D63",label:"Where you'd stay"},
            do:{color:"#2E6E75",label:"What you'd do"},
            add:{color:"#E0A03A",label:"Optional add-on"}},
  pins:[
    {name:"Funchal",lat:32.6669,lon:-16.9241,kind:"base",note:"The capital and the easy answer. Old Town, the farmers' market, the marina, the Lido sea pools and the Monte cable car all within reach without a car."},
    {name:"Calheta",lat:32.7189,lon:-17.1789,kind:"base",note:"Sunniest corner of the island and the only real sandy beach. Quieter, villa country, about 45 minutes from Funchal."},
    {name:"Ponta do Sol",lat:32.6797,lon:-17.1017,kind:"base",note:"Small south-coast town with the island's best sunshine record. Middle ground between Funchal buzz and Calheta calm."},
    {name:"Santa Cruz",lat:32.6875,lon:-16.7936,kind:"base",note:"Ten minutes from the airport. Worth considering only if your flights land late or leave early."},
    {name:"Porto Moniz",lat:32.8667,lon:-17.1667,kind:"do",note:"Volcanic rock pools filled by the Atlantic. Enclosed, lifeguarded, and the single best swim on the island for a mixed-age group."},
    {name:"Pico do Arieiro",lat:32.7353,lon:-16.9283,kind:"do",note:"1,818 m. Drive up in the dark for sunrise above the cloud layer, or hike the ridge toward Pico Ruivo if the teens are keen."},
    {name:"Monte",lat:32.6667,lon:-16.9000,kind:"do",note:"Cable car up, tropical garden at the top, then two men in straw hats push you back down the hill in a wicker sled."},
    {name:"Ponta de São Lourenço",lat:32.7442,lon:-16.6939,kind:"do",note:"The bare, wind-scoured eastern tip. An easy out-and-back walk with cliffs on both sides — the most drama per unit of effort."},
    {name:"Câmara de Lobos",lat:32.6500,lon:-16.9833,kind:"do",note:"Working fishing harbour just west of Funchal, painted boats and all. Best late-afternoon stop on the island."},
    {name:"Santana",lat:32.8000,lon:-16.8833,kind:"do",note:"North coast, triangular thatched houses, and the gateway to the laurel forest levadas."},
    {name:"Porto Santo",lat:33.0667,lon:-16.3333,kind:"add",note:"Nine kilometres of sand, two and a half hours by ferry. The obvious two-day add-on if anyone wants a beach holiday inside the adventure holiday."}
  ],
  doing:[
    {wiki:"Levada",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Levada%2C_Madeira_%2848807052981%29.jpg/1280px-Levada%2C_Madeira_%2848807052981%29.jpg",flickr:"levada,madeira",tag:"Half day, ages 10+",name:"Walk a levada",
     text:"Madeira is laced with hand-cut irrigation channels that contour around the mountains at a near-constant gradient. Hours of forest walking with almost no climbing — exactly what you want with a spread of ages. Pick Levada dos Balcões or Levada do Rei and skip the ones with tunnels and drop-offs."},
    {wiki:"Porto Moniz",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Porto_Moniz_from_the_south_2013.JPG/1280px-Porto_Moniz_from_the_south_2013.JPG",flickr:"porto+moniz,madeira",tag:"Half day, everyone",name:"Swim the lava pools",
     text:"At Porto Moniz the Atlantic fills a field of black volcanic rock. Enclosed, calm and supervised, so the ten-year-olds and the seventeen-year-olds can both be left alone in it. Bring water shoes."},
    {wiki:"Monte, Madeira",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Toboggan_Downhill._Monte%2C_Funchal.jpg/1280px-Toboggan_Downhill._Monte%2C_Funchal.jpg",flickr:"monte+toboggan,madeira",tag:"Half day, everyone",name:"Cable car and toboggan",
     text:"Ride up over Funchal's rooftops to Monte, walk the tropical garden, then take a wicker sled two kilometres back down the public road, steered by two men in straw hats. Faintly ridiculous, and nobody forgets it."},
    {wiki:"Whale watching",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Madeira-Atlantic-Margarita_Sunset-Whale_and_Dolphin_Watching_Tours-02ASD.jpg/1280px-Madeira-Atlantic-Margarita_Sunset-Whale_and_Dolphin_Watching_Tours-02ASD.jpg",flickr:"whale+watching,madeira",tag:"3–4 hrs, everyone",name:"Get out on the water",
     text:"Resident pilot whales and several dolphin species sit just offshore year-round, so sightings are unusually reliable. Book a smaller RIB for the teens and a catamaran if anyone in the group gets seasick."},
    {wiki:"Pico do Arieiro",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Pico_do_Areeiro%2C_2025.jpg/1280px-Pico_do_Areeiro%2C_2025.jpg",flickr:"pico+arieiro,madeira",tag:"Pre-dawn, the keen ones",name:"Sunrise above the clouds",
     text:"Leave at 4am, drive to 1,818 metres, and watch the sun come up over a solid floor of cloud with the peaks poking through. Go with a driver so nobody handles mountain switchbacks in the dark."},
    {wiki:"Canyoning",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Bali_canyoning.jpg/1280px-Bali_canyoning.jpg",flickr:"canyoning,waterfall",tag:"Half day, usually 14+",name:"Canyoning",
     text:"Guided descents through the island's ravines: abseiling down waterfalls, jumping into pools, sliding rock chutes. Most operators take 14 and up, so this is the one activity that splits the group — plan a pool day for whoever stays back."},
    {wiki:"Funchal",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Funchal%2C_Jardins_da_Quinta_Vigia_%28lookout%29.jpg/1280px-Funchal%2C_Jardins_da_Quinta_Vigia_%28lookout%29.jpg",flickr:"funchal,madeira",tag:"Any evening",name:"Funchal old town",
     text:"The Zona Velha's painted doors, the Mercado dos Lavradores in the morning, the CR7 museum for whoever cares, and enough restaurants at enough price points to feed twelve without booking six weeks out."},
    {wiki:"Madeira wine",photo:"https://upload.wikimedia.org/wikipedia/commons/f/f4/MadeiraWinery.jpg",flickr:"madeira+wine,cellar",tag:"Two hours, adults",name:"A tasting for the grown-ups",
     text:"Blandy's Wine Lodge in central Funchal runs short tours through the heated attics where Madeira is aged. Slot it against a pool afternoon so the parents get a turn."}
  ],
  bases:[
    {name:"Funchal",text:"Least driving, most choice. Walk to dinner, put the teens on the cable car, reach the marina for boat trips without organising cars. Rentals are smaller and closer together here — expect two or three apartments rather than one villa.",price:"Two 6-guest apartments, ~€2,400–3,600/wk total"},
    {name:"Calheta & Ponta do Sol",text:"The sunny southwest. Where the big villas with private pools are, so it's the best shot at putting all twelve under one roof with a barbecue and somewhere for kids to disappear to. You will be driving 40–50 minutes to Funchal.",price:"One 10–12 guest villa, ~€3,000–5,000/wk"},
    {name:"Santa Cruz & Machico",text:"East side, minutes from the airport, closest to Ponta de São Lourenço. More residential and less scenic, but the cheapest of the three and sensible if your flights are awkward.",price:"Two villas, ~€2,000–3,200/wk total"}
  ],
  itinerary:[
    {n:1,d:"Arrive",h:"Land, collect vans, settle",p:"Airport is 20 minutes from Funchal. Groceries, unpack, an easy dinner nearby. Nobody attempts anything ambitious on day one."},
    {n:2,d:"Funchal",h:"Old town and the sea pools",p:"Mercado dos Lavradores in the morning, wander the Zona Velha, then the Lido complex or Praia Formosa for the afternoon."},
    {n:3,d:"Monte",h:"Cable car, garden, toboggan",p:"Up mid-morning, tropical garden, sled down after lunch. Câmara de Lobos harbour on the way home for sunset."},
    {n:4,d:"Ocean",h:"Whale and dolphin boat",p:"Morning sailing out of Funchal marina. Free afternoon at the villa; optional sunset catamaran for anyone with energy left."},
    {n:5,d:"Forest",h:"Levada walk",p:"Drive north to Ribeiro Frio or Rabaçal. Three to four hours of level forest walking, lunch at the trailhead café."},
    {n:6,d:"North coast",h:"Porto Moniz and Santana",p:"Full loop of the northwest with viewpoint stops, the lava pools for a long swim, thatched houses at Santana on the way back."},
    {n:7,d:"Split day",h:"Canyoning, or a slower alternative",p:"Teens 14+ go canyoning or coasteering with a guide. Everyone else takes the Ponta de São Lourenço walk or a pool day."},
    {n:8,d:"High ground",h:"Arieiro sunrise, then farewell dinner",p:"Pre-dawn drive to the peak for whoever wants it, back by mid-morning for a slow last day. Book dinner for twelve in Funchal."},
    {n:"+2",d:"Optional",h:"Porto Santo",p:"Ferry over for two nights of flat sand and nothing to organise. Worth it if you're staying the full two weeks."}
  ],
  budget:{rows:[
      ["Flights, East Coast to Funchal","$700 – $1,000","Round trip via Lisbon, booked 3–4 months out. No nonstop from the US, and no Space-A route that gets you closer than mainland Europe."],
      ["Accommodation, 8–10 nights","$600 – $1,200","Villa or apartment cost split twelve ways. The biggest lever you have."],
      ["Vans, fuel, transfers","$120 – $200","Two 7-seaters for the week, plus airport transfers if you'd rather not drive on arrival day."],
      ["Guided activities","$150 – $350","Boat trip, a jeep day, canyoning for the teens. Everything else on the list is free or nearly free."],
      ["Food","$280 – $550","A mix of villa cooking and eating out. Madeira restaurants run noticeably cheaper than mainland Portugal."]],
    total:["Per person, 8–10 days","$1,850 – $3,100"],
    note:"For twelve people that's roughly $22,000 at the low end and $37,000 at the high end. The spread is almost entirely accommodation and how many guided days you buy — self-catering in one villa and doing your own driving lands you near the bottom."},
  alt:{heading:"The cruise version, honestly compared",
    intro:"A 7-night Atlantic or western Mediterranean sailing out of Lisbon, Barcelona or Southampton can include Funchal, Tenerife and Gran Canaria. It solves different problems than it creates.",
    pro:["One booking covers beds, most meals and transport between islands — no villa hunt, no van rental, no group logistics.",
         "Teen clubs, sports decks and waterslides give the 10-to-18 range somewhere to go that isn't with their parents.",
         "Kids-sail-free and third-and-fourth-guest promotions can pull the per-person cost well below a villa week.",
         "Cabin doors close. Twelve people sharing one house for ten days is not restful for everyone."],
    con:["You get roughly eight hours in Madeira instead of eight days. Levadas, the north coast and the peaks are all out of reach on a port call.",
         "Summer 2028 itineraries aren't published yet, and Madeira drops off Atlantic routes in some seasons — you may end up with the Canaries instead.",
         "Twelve people means four to six cabins. Getting them adjacent takes early booking or a suite.",
         "Excursions, drinks packages and specialty dining are where the advertised fare stops being the real fare."],
    verdict:"If the group's priority is time together with minimal organising, the cruise wins. If it's the island itself — the hiking, the water, the sense of having actually been somewhere — the land trip wins, and it isn't close."},
  compare:{heading:"Why Madeira and not the Azores or the Canaries",options:[
    {name:"Madeira",pick:true,text:"One island, everything within an hour, and a genuine mix of mountain, forest, ocean and town. The easiest of the three to run with three families and no advance recon."},
    {name:"Azores",text:"More dramatic and more raw — crater lakes, volcanoes, thermal springs. But the good stuff is spread across several islands, which means inter-island flights, more packing days, and weather that cancels plans."},
    {name:"Canaries",text:"Better beaches and more reliable heat, especially Tenerife and Gran Canaria. Also more built-up and resort-shaped. Good if the group's real want is sun and a pool; less good if it's adventure."}
  ]}
},

/* ============================ GREECE ============================ */
{
  id:"greece", tab:"Greece", title:"Greece",
  theme:{dark:"#143845", accent:"#B0343A", sun:"#D9A441"},

  pins:[
    {name:"Athens",lat:37.9838,lon:23.7275,kind:"base",note:"Three nights is right: the Acropolis and its museum, the Ancient Agora, a food walk through Plaka, and a rooftop dinner. Any longer in July heat and the group will wilt."},
    {name:"Naxos",lat:37.1036,lon:25.3766,kind:"base",note:"The value pick and the best all-round family island. Long sandy beaches you can park at, windsurfing off Mikri Vigla, mountain villages inland, and prices roughly half of Santorini."},
    {name:"Paros",lat:37.0856,lon:25.1494,kind:"base",note:"Naxos's alternative — slightly livelier, slightly pricier, equally good beaches. Pick one, not both."},
    {name:"Santorini",lat:36.4167,lon:25.4333,kind:"base",note:"Two nights, not four. The caldera view is worth the trip and the crowds and prices are worth escaping. Stay in Imerovigli or Firostefani rather than Oia."},
    {name:"Heraklion",lat:35.3387,lon:25.1442,kind:"base",note:"Crete's practical base: the airport for the flight home, Knossos twenty minutes away, and the archaeological museum that makes sense of it."},
    {name:"Chania",lat:35.5138,lon:24.0180,kind:"base",note:"Western Crete and the prettier town — a Venetian harbour, a walkable old quarter, and the Samaria trailhead within reach. Three hours from Heraklion airport."},
    {name:"Knossos",lat:35.2980,lon:25.1630,kind:"do",note:"The Bronze Age palace, 3,500 years old and partly reconstructed. Go early, go with a guide, and see the museum in Heraklion the same day or it won't land."},
    {name:"Samaria Gorge",lat:35.2833,lon:23.9500,kind:"do",note:"Sixteen kilometres downhill through a limestone gorge, ending at a beach and a boat out. Six hours, no shade at the end, and genuinely hard — but the standout day for anyone who can do it."},
    {name:"Cape Sounion",lat:37.6503,lon:24.0245,kind:"do",note:"The Temple of Poseidon on a headland ninety minutes from Athens. Time it for sunset and it's the best evening of the Athens leg."},
    {name:"Delos",lat:37.3936,lon:25.2686,kind:"do",note:"An entire uninhabited island that is one archaeological site, thirty minutes by boat from Mykonos. Half a day, no shade, worth it."},
    {name:"Mykonos",lat:37.4467,lon:25.3289,kind:"add",note:"On most cruise itineraries and skippable on a land trip. Windmills, beach clubs and prices to match. Go for Delos, not for Mykonos."},
    {name:"Rhodes",lat:36.4349,lon:28.2176,kind:"add",note:"A walled medieval city you can still walk around, plus beaches. Too far east for the land itinerary; a highlight if you end up cruising."}

  doing:[
    {wiki:"Acropolis of Athens",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/1029_Acropolis_of_Athens_in_Greece_at_night_Photo_by_Giles_Laurent.jpg/1280px-1029_Acropolis_of_Athens_in_Greece_at_night_Photo_by_Giles_Laurent.jpg",flickr:"acropolis,athens",tag:"Half day, everyone",name:"The Acropolis, early",
     text:"Be at the gate when it opens. By eleven the marble is hot, the crowds are three deep and nobody is enjoying themselves. Pair it with the Acropolis Museum in the afternoon — air conditioned, and it explains what you just walked through."},
    {wiki:"Santorini",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Oia_sunset_-_panoramio_%282%29.jpg/1280px-Oia_sunset_-_panoramio_%282%29.jpg",flickr:"santorini,oia",tag:"Two days",name:"The caldera",
     text:"Santorini is a drowned volcano and the whole town sits on its rim. Walk the Fira-to-Oia path in the early evening, take the boat out to the crater and the hot springs, and accept that you're paying a premium for a view. Two nights is enough."},
    {wiki:"Naxos",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/Naxos_%CE%9D%CE%AC%CE%BE%CE%BF%CF%82_2020-08-20_02_Chora_Grotta_and_Vintzi_beaches.jpg/1280px-Naxos_%CE%9D%CE%AC%CE%BE%CE%BF%CF%82_2020-08-20_02_Chora_Grotta_and_Vintzi_beaches.jpg",flickr:"naxos,beach",tag:"Four days",name:"Naxos beaches and villages",
     text:"Plaka and Agios Prokopios are long, sandy and shallow. Mikri Vigla has the windsurfing and kitesurfing schools. Inland, Halki and Apiranthos are marble villages with tavernas and no bus tours. This is the leg where the trip gets cheap and relaxed."},
    {wiki:"Knossos",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Knossos_-_Palace_of_the_Minoans.jpg/1280px-Knossos_-_Palace_of_the_Minoans.jpg",flickr:"knossos,crete",tag:"Half day, ages 10+",name:"Knossos and the Minoans",
     text:"Europe's oldest city, and the labyrinth story starts here. The 1900s reconstruction is controversial and also the reason it's legible to a twelve-year-old rather than a field of foundations."},
    {wiki:"Samaria Gorge",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/%CE%A6%CE%B1%CF%81%CE%AC%CE%B3%CE%B3%CE%B9_%CE%A3%CE%B1%CE%BC%CE%B1%CF%81%CE%B9%CE%AC%CF%82.jpg/1280px-%CE%A6%CE%B1%CF%81%CE%AC%CE%B3%CE%B3%CE%B9_%CE%A3%CE%B1%CE%BC%CE%B1%CF%81%CE%B9%CE%AC%CF%82.jpg",flickr:"samaria+gorge,crete",tag:"Full day, fit walkers",name:"Walk the Samaria Gorge",
     text:"Sixteen kilometres, all downhill, through a gorge that narrows to three metres wide between 300-metre walls. It ends at a beach where you catch a boat out. The hardest thing on the list and the one people talk about afterwards."},
    {wiki:"Chania",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Aerial_view_of_the_Old_Venetian_Harbour_in_Chania%2C_Greece.jpg/1280px-Aerial_view_of_the_Old_Venetian_Harbour_in_Chania%2C_Greece.jpg",flickr:"chania,venetian+harbour",tag:"Two evenings",name:"Chania's old harbour",
     text:"A Venetian lighthouse, an Ottoman mosque, and a horseshoe of waterfront tavernas. The best place in Greece to sit twelve people down at one long table outside."},
    {wiki:"Delos",photo:"https://upload.wikimedia.org/wikipedia/commons/1/1d/Delos_general.jpg",flickr:"delos,greece",tag:"Half day",name:"Delos",
     text:"Sacred to Apollo, once the richest port in the Aegean, now an empty island of ruins with a caretaker and a boat schedule. Mosaic floors, a terrace of marble lions, and nobody living there since antiquity."},
    {wiki:"Cape Sounion",photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Cape_Sounion_AC.JPG/1280px-Cape_Sounion_AC.JPG",flickr:"sounion,poseidon+temple",tag:"Evening",name:"Sunset at Sounion",
     text:"Fifteen Doric columns on a cliff above the Aegean, ninety minutes down the coast from Athens. Hire a van, go late, eat on the way back."}
  ],
  bases:[
    {name:"Athens",text:"Three nights in Koukaki or Plaka puts you walking distance from the Acropolis. Apartments here are cheap by European capital standards and two three-bedroom flats will house the group easily. Skip the rental car — you won't want it in Athens.",price:"Two 3-bed apartments, ~€500–800/night total"},
    {name:"Naxos or Paros",text:"The value leg. Villas with pools within walking distance of a beach are genuinely affordable here, and you'll want a car or two for the villages. Four nights is the right length — long enough to stop moving.",price:"One 10–12 guest villa, ~€450–850/night"},
    {name:"Santorini",text:"The expensive leg, so keep it short. Caldera-view rooms in Imerovigli cost roughly double the same room in Fira and triple what you'd pay on Naxos. Two nights, then move on.",price:"Three or four rooms, ~€700–1,400/night total"},
    {name:"Crete",text:"Big island, so pick an end. Heraklion is practical and close to Knossos; Chania is prettier and closer to Samaria. Villas are plentiful and reasonable at both. You will want two vans here.",price:"One large villa, ~€400–800/night"}
  ],
  itinerary:[
    {n:1,d:"Athens",h:"Land, settle, eat late",p:"Airport to the city in 45 minutes — the X95 bus is €5.50, the metro €9, a flat-rate taxi €40. Nobody attempts the Acropolis on arrival day."},
    {n:2,d:"Athens",h:"Acropolis at opening, museum after",p:"Gate at 8am, Parthenon and the Erechtheion before the heat. Acropolis Museum in the afternoon, Anafiotika at dusk."},
    {n:3,d:"Athens",h:"Agora, market, then Sounion",p:"Ancient Agora in the morning, the central market for lunch, van down the coast for sunset at the Temple of Poseidon."},
    {n:4,d:"Naxos",h:"Morning ferry, afternoon beach",p:"X96 bus straight to Piraeus port gates (€5.50, 60–90 min), then about four hours on the high-speed. Collect cars and swim before dinner."},
    {n:5,d:"Naxos",h:"Beach day",p:"Plaka or Agios Prokopios. Windsurfing or kitesurfing lessons at Mikri Vigla for whoever wants them."},
    {n:6,d:"Naxos",h:"Mountain villages",p:"Drive inland to Halki and Apiranthos, the Temple of Demeter on the way, lunch in a village square. Back to the coast by four."},
    {n:7,d:"Naxos",h:"Free day",p:"Boat trip, the Portara at sunset, or nothing at all. Build one of these into every leg or the trip becomes a forced march."},
    {n:8,d:"Santorini",h:"Ferry across, caldera walk",p:"Two hours by boat. Check in at Imerovigli, then the Fira-to-Oia path in the cool of the evening."},
    {n:9,d:"Santorini",h:"Volcano boat and hot springs",p:"Morning sailing into the crater, swim at the hot springs, back for an early dinner. Red Beach if there's time."},
    {n:10,d:"Crete",h:"Ferry to Heraklion, Knossos",p:"Two hours to Crete. Knossos in the late afternoon when the tour buses have gone, or first thing tomorrow if the boat runs late."},
    {n:11,d:"Crete",h:"Split day: gorge or coast",p:"Samaria for the walkers — a full six-hour day ending at the beach. Everyone else takes Chania's old town and a swim at Elafonissi."},
    {n:12,d:"Crete",h:"Slow day, then farewell dinner",p:"Beach, archaeological museum, or the Venetian harbour. One long table booked for twelve."},
    {n:13,d:"Home",h:"Fly Heraklion to Athens and on",p:"Fifty-five minutes to Athens and connect. Or an overnight in Athens if the timings are ugly."}
  ],
  budget:{rows:[
      ["Flights, East Coast to Athens","$650 – $1,100","Nonstop from JFK, EWR and BOS in summer. There is no usable Space-A route into Greece — AMC's European legs end at Ramstein, Rota or Sigonella, and you would still buy a commercial ticket or a long ferry from there. See the Germany tab if the military-travel angle is the draw."],
      ["Accommodation, 12 nights","$850 – $1,600","Four bases split twelve ways. Santorini alone is roughly a quarter of this for two of the twelve nights."],
      ["Ferries and the flight home","$250 – $400","Three high-speed crossings plus Heraklion to Athens. Conventional ferries cost about half and take about twice as long."],
      ["Cars, vans, local transport","$120 – $220","Two cars on Naxos, two vans on Crete, airport and port buses in Athens at €5.50 a head. No rental car needed in Athens."],
      ["Sites, guides and activities","$180 – $350","Acropolis, Knossos, Delos, the volcano boat, Samaria, plus windsurfing lessons if you want them."],
      ["Food","$450 – $780","Twelve days at roughly $38–65 a head, mixing villa cooking with tavernas. Athens and the smaller islands are cheap; Santorini is not."]],
    total:["Per person, 12–13 days","$2,500 – $4,400"],
    note:"Roughly $30,000 to $53,000 for twelve people. Two things move this number more than anything else: how many nights you spend on Santorini, and whether you cook. Cutting Santorini to two nights and self-catering on Naxos and Crete is worth several hundred dollars a head."},
  alt:{heading:"The cruise version, honestly compared",
    intro:"A 7-night Greek-islands sailing round-trip from Piraeus hits Mykonos, Santorini, Rhodes and Crete, and most lines will sell you two nights in Athens either side. Fares run roughly $1,400–$2,000 a head before flights.",
    pro:["Four to seven islands in one week, with none of the ferry booking, villa hunting or car rental that the land trip requires.",
         "Meals and beds are bundled, so the cost is knowable up front — which matters when three families are splitting it.",
         "Teen spaces, pools and sports decks mean the 10-to-18 range has somewhere to be that isn't a taverna.",
         "Athens is easy to bolt on at either end, so you don't lose the Acropolis."],
    con:["Santorini gets you eight hours, Crete gets you six. Knossos or a beach — not both. Samaria is impossible.",
         "Port days in July mean arriving with six thousand other people. Oia at 2pm is a different place than Oia at 8pm.",
         "$1,400–$2,000 a head is before flights, excursions, drinks and specialty dining, and those are where the real number lives.",
         "Twelve people is four to six cabins. Adjacent rooms need booking a year out."],
    verdict:"The cruise is the better deal and the worse trip. If the group can absorb 12 days and the logistics of four bases, the land version gives you Greece rather than a tour of its harbours — and it costs more mostly because it lasts longer."},
  compare:{heading:"Three ways to do this",options:[
    {name:"Land, 12–13 days",pick:true,text:"Athens, Naxos, Santorini, Crete. Deepest version, most flexible, best for a group that wants hiking, villages and villa kitchens. Most work to plan."},
    {name:"Cruise, 7 nights + Athens",text:"Piraeus round-trip through Mykonos, Santorini, Rhodes and Crete with two nights in Athens either side. Least planning, most islands, shallowest."},
    {name:"Hybrid, 11–12 days",text:"Two nights Athens, the 7-night cruise, then three nights on Crete or Naxos after you disembark. The ship's easy group time plus one island you actually stay on."}
  ]}
},

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* hero A — elevation cross-section (Madeira) */
function heroProfile(){
  const pts=[{x:40,y:1818,l:"Pico do Arieiro",s:"1,818 m — sunrise above the clouds"},
             {x:26,y:900,l:"Levada country",s:"~900 m — level forest walking"},
             {x:14,y:120,l:"Funchal",s:"Sea level — market, old town, marina"},
             {x:70,y:60,l:"Porto Moniz",s:"Sea level — volcanic pools"}];
  const W=1000,H=300,PAD=34;
  const sx=v=>PAD+(v/100)*(W-PAD*2), sy=v=>H-PAD-(v/2000)*(H-PAD-18);
  const path=`M ${sx(0)} ${sy(0)}
    C ${sx(8)} ${sy(60)}, ${sx(12)} ${sy(90)}, ${sx(14)} ${sy(120)}
    C ${sx(20)} ${sy(500)}, ${sx(24)} ${sy(820)}, ${sx(26)} ${sy(900)}
    C ${sx(31)} ${sy(1300)}, ${sx(36)} ${sy(1750)}, ${sx(40)} ${sy(1818)}
    C ${sx(46)} ${sy(1780)}, ${sx(52)} ${sy(1200)}, ${sx(58)} ${sy(700)}
    C ${sx(64)} ${sy(300)}, ${sx(68)} ${sy(110)}, ${sx(70)} ${sy(60)}
    C ${sx(76)} ${sy(30)}, ${sx(84)} ${sy(10)}, ${sx(100)} ${sy(0)}`;
  const marks=pts.map(p=>`<g>
      <line x1="${sx(p.x)}" y1="${sy(p.y)}" x2="${sx(p.x)}" y2="${sy(p.y)-30}" stroke="rgba(241,239,230,.5)" stroke-width="1"/>
      <circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="5" fill="var(--sun)"/>
      <text x="${sx(p.x)}" y="${sy(p.y)-40}" text-anchor="middle" fill="#F1EFE6" font-family="Fraunces,Georgia,serif" font-size="21" font-weight="600">${esc(p.l)}</text>
      <text x="${sx(p.x)}" y="${sy(p.y)-20}" text-anchor="middle" fill="rgba(241,239,230,.8)" font-family="Karla,sans-serif" font-size="15">${esc(p.s)}</text>
    </g>`).join("");
  return `<figure class="section-figure">
    <svg class="xsec" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cross-section of Madeira from Funchal on the south coast up to Pico do Arieiro at 1,818 metres and down to Porto Moniz on the north coast.">
      <line x1="${PAD}" y1="${sy(0)}" x2="${W-PAD}" y2="${sy(0)}" stroke="rgba(241,239,230,.4)" stroke-width="1"/>
      <path d="${path} L ${sx(100)} ${sy(0)} Z" fill="rgba(241,239,230,.16)"/>
      <path d="${path}" fill="none" stroke="#F1EFE6" stroke-width="2.5" stroke-linejoin="round"/>
      ${marks}
      <text x="${PAD}" y="${sy(0)+22}" fill="rgba(241,239,230,.68)" font-family="Karla,sans-serif" font-size="15">south coast</text>
      <text x="${W-PAD}" y="${sy(0)+22}" text-anchor="end" fill="rgba(241,239,230,.68)" font-family="Karla,sans-serif" font-size="15">north coast</text>
    </svg>
    <figcaption>Madeira is 35 miles long and rises to 1,818 metres. That vertical squeeze is the whole appeal — you can be swimming at nine and walking in cloud forest at one.</figcaption>
  </figure>`;
}

/* hero B — route and pacing (Greece, Japan) */
function heroHops(hero){
  const W=1000,H=250,Y=150,PAD=30;
  const sx=v=>PAD+(v/100)*(W-PAD*2);
  const legs=hero.legs, last=legs.length-1;
  const links=legs.map((n,i)=>{ if(!n.in) return "";
      const a=sx(legs[i-1].x), b=sx(n.x), mid=(a+b)/2;
      return `<g>
        <line x1="${a+12}" y1="${Y}" x2="${b-12}" y2="${Y}" stroke="rgba(241,239,230,.55)" stroke-width="1.5" stroke-dasharray="5 5"/>
        <text x="${mid}" y="${Y+64}" text-anchor="middle" fill="rgba(241,239,230,.82)" font-family="Karla,sans-serif" font-size="15">${esc(n.in)}</text>
      </g>`;}).join("");
  const nodes=legs.map((n,i)=>`<g>
      <circle cx="${sx(n.x)}" cy="${Y}" r="${(i===last&&!n.nights)?6:9}" fill="${(i===last&&!n.nights)?'rgba(241,239,230,.55)':'var(--sun)'}" stroke="#F1EFE6" stroke-width="2"/>
      <text x="${sx(n.x)}" y="${Y-34}" text-anchor="middle" fill="#F1EFE6" font-family="Fraunces,Georgia,serif" font-size="24" font-weight="600">${esc(n.name)}</text>
      <text x="${sx(n.x)}" y="${Y-14}" text-anchor="middle" fill="rgba(241,239,230,.8)" font-family="Karla,sans-serif" font-size="15">${esc(n.sub)}</text>
      ${n.nights?`<text x="${sx(n.x)}" y="${Y+30}" text-anchor="middle" fill="var(--sun)" font-family="Karla,sans-serif" font-size="16" font-weight="500">${esc(n.nights)}</text>`:""}
    </g>`).join("");
  return `<figure class="section-figure">
    <svg class="xsec" viewBox="0 0 ${W} ${H}" role="img" aria-label="Route diagram of the trip's bases, with travel time and cost between each.">
      ${links}${nodes}
    </svg>
    <figcaption>${esc(hero.caption)}</figcaption>
  </figure>`;
}

/* hero C — drive-time radius (Germany) */
function heroRadius(hero){
  const W=1000,H=340,OX=500,OY=300,PH=44;
  const rad=d=>d*Math.PI/180;
  const arcs=[1,2,3].map(h=>{const r=h*PH;
    return `<path d="M ${OX-r} ${OY} A ${r} ${r} 0 0 1 ${OX+r} ${OY}" fill="none"
              stroke="rgba(241,239,230,.28)" stroke-width="1" stroke-dasharray="3 5"/>
            <text x="${OX-r}" y="${OY+19}" text-anchor="middle" fill="rgba(241,239,230,.6)"
              font-family="Karla,sans-serif" font-size="14">${h} hr</text>`;}).join("");
  const pts=hero.points.map(p=>{
    const r=p.h*PH, x=OX+r*Math.cos(rad(p.deg)), y=OY-r*Math.sin(rad(p.deg));
    const side = x>OX+30 ? 1 : (x<OX-30 ? -1 : 0);
    const anchor = side===1?"start":side===-1?"end":"middle";
    const lx = x + side*14, ly = side===0 ? y-16 : y+4;
    return `<g>
      <line x1="${OX}" y1="${OY}" x2="${x}" y2="${y}" stroke="rgba(241,239,230,.18)" stroke-width="1"/>
      <circle cx="${x}" cy="${y}" r="5.5" fill="var(--sun)" stroke="#F1EFE6" stroke-width="1.5"/>
      <text x="${lx}" y="${ly}" text-anchor="${anchor}" font-family="Fraunces,Georgia,serif" font-size="17" font-weight="600" fill="#F1EFE6">${esc(p.name)}<tspan font-family="Karla,sans-serif" font-size="13" font-weight="400" fill="rgba(241,239,230,.72)" dx="7">${esc(p.t)}</tspan></text>
    </g>`;}).join("");
  return `<figure class="section-figure">
    <svg class="xsec" viewBox="0 0 ${W} ${H}" role="img" aria-label="Drive times from Ramstein Air Base to Trier, the Rhine Valley, Luxembourg, Heidelberg, Europa-Park, Strasbourg, Munich and Garmisch.">
      <line x1="${OX-260}" y1="${OY}" x2="${OX+260}" y2="${OY}" stroke="rgba(241,239,230,.35)" stroke-width="1"/>
      ${arcs}${pts}
      <circle cx="${OX}" cy="${OY}" r="7" fill="#F1EFE6"/>
      <text x="${OX+12}" y="${OY+19}" fill="rgba(241,239,230,.8)" font-family="Karla,sans-serif" font-size="14">${esc(hero.origin)}</text>
    </svg>
    <figcaption>${esc(hero.caption)}</figcaption>
  </figure>`;
}

function renderHero(d){
  if(d.hero.type==="hops") return heroHops(d.hero);
  if(d.hero.type==="radius") return heroRadius(d.hero);
  return heroProfile();
}

/* photos: Wikipedia first, keyword photo second, caption third */
function attach(slot,src,onFail){
  const img=new Image();
  img.alt=slot.dataset.alt||"";
  /* No loading="lazy" here. This image is detached until onload appends it, and a
     detached lazy image never begins loading — so the handler never fires and the
     card stays on its placeholder forever. Verified: detached+lazy issues no request
     at all; detached without lazy loads normally. Photos are already only fetched
     for the tab you are looking at, so lazy bought nothing. */
  img.onload=()=>{slot.innerHTML="";slot.appendChild(img);slot.dataset.done="1";};
  img.onerror=()=>{ if(onFail) onFail(); };
  img.src=src;
}
function keywordFallback(slot){
  if(slot.dataset.done) return;
  const q=slot.dataset.q; if(!q) return;
  attach(slot,"https://loremflickr.com/900/675/"+q+"?lock="+(slot.dataset.lock||1));
}
async function loadPhotos(root){
  const slots=[...root.querySelectorAll(".shot")];
  if(!slots.length) return;
  slots.forEach(s=>{ if(s.dataset.photo) attach(s,s.dataset.photo,()=>keywordFallback(s)); });
  const pending=slots.filter(s=>!s.dataset.photo);
  if(!pending.length) return;
  const titles=[...new Set(pending.map(s=>s.dataset.wiki).filter(Boolean))];
  let map={},norm={};
  try{
    const url="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*"
             +"&prop=pageimages&piprop=thumbnail&pithumbsize=1000&redirects=1&titles="
             +titles.map(encodeURIComponent).join("|");
    const j=await (await fetch(url)).json();
    (j.query?.normalized||[]).forEach(n=>norm[n.from.toLowerCase()]=n.to);
    (j.query?.redirects||[]).forEach(n=>norm[n.from.toLowerCase()]=n.to);
    Object.values(j.query?.pages||{}).forEach(pg=>{
      if(pg.thumbnail?.source) map[pg.title.toLowerCase()]=pg.thumbnail.source;
    });
  }catch(e){}
  pending.forEach(s=>{
    let t=(s.dataset.wiki||"").toLowerCase();
    if(norm[t]) t=norm[t].toLowerCase();
    const src=map[t];
    if(src) attach(s,src,()=>keywordFallback(s)); else keywordFallback(s);
  });
}

/* maps */
function gmapSrc(q,z,type){
  return "https://maps.google.com/maps?q="+encodeURIComponent(q)+"&t="+type+"&z="+z+"&ie=UTF8&iwloc=&output=embed";
}
function buildPinMap(d){
  const slot=document.getElementById("pinmap-"+d.id);
  if(!slot) return;
  if(slot.dataset.ready){ slot._map && setTimeout(()=>slot._map.invalidateSize(),50); return; }
  slot.dataset.ready="1";
  const m=L.map(slot,{scrollWheelZoom:false}).setView(d.map.center,d.map.zoom);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:17,attribution:"&copy; OpenStreetMap"}).addTo(m);
  const g=[];
  d.pins.forEach(p=>{
    const mk=L.circleMarker([p.lat,p.lon],{radius:p.kind==="base"?9:7,color:"#fff",weight:2,
      fillColor:d.pinKinds[p.kind].color,fillOpacity:1}).addTo(m);
    mk.bindPopup(`<div class="pin-pop"><b>${esc(p.name)}</b><small>${esc(d.pinKinds[p.kind].label)}</small>${esc(p.note)}</div>`,{maxWidth:290});
    mk.bindTooltip(p.name,{direction:"top"});
    g.push(mk);
  });
  m.fitBounds(L.featureGroup(g).getBounds().pad(0.15));
  slot._map=m;
  setTimeout(()=>m.invalidateSize(),80);
}

/* panel */
function renderPanel(d){
  const p=document.createElement("div");
  p.id="panel-"+d.id;
  p.setAttribute("role","tabpanel");

  p.innerHTML=`
  <section class="hero"><div class="wrap">
    <h1>${esc(d.title)}</h1>
    <p class="lede">${esc(d.lede)}</p>
    ${renderHero(d)}
  </div></section>

  <div class="facts"><dl class="wrap">
    ${d.facts.map(f=>`<div class="fact"><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join("")}
  </dl></div>

  <section class="band"><div class="wrap">
    <h2>Where this all is</h2>
    <p class="intro">Start with the real map — pan, zoom, switch to satellite, drop into Street View. The annotated version underneath marks the places in this brochure and why each one is on the list.</p>
    <div class="maptools">
      <span class="lbl">Google view</span>
      <button class="mbtn" type="button" data-type="m" aria-pressed="true">Map</button>
      <button class="mbtn" type="button" data-type="k" aria-pressed="false">Satellite</button>
    </div>
    <iframe class="gmap" id="gmap-${d.id}" loading="lazy" allowfullscreen
      referrerpolicy="no-referrer-when-downgrade" title="Google map of ${esc(d.title)}"
      src="${gmapSrc(d.gmap.q,d.gmap.z,'m')}"></iframe>
    <div id="pinmap-${d.id}" class="pinmap"></div>
    <div class="legend">
      ${Object.values(d.pinKinds).map(k=>`<span><i style="background:${k.color}"></i>${esc(k.label)}</span>`).join("")}
    </div>
    <p class="caption">Tap any marker on the lower map for what it is and why it made the shortlist.</p>
  </div></section>

  <section class="band dark"><div class="wrap">
    <h2>What you'd actually do</h2>
    <p class="intro">Enough range that a ten-year-old and a seventeen-year-old both get a good day, without either being dragged through somebody else's holiday.</p>
    <div class="cards">
      ${d.doing.map((c,i)=>`
        <article class="card"><figure>
          <div class="shot" data-wiki="${esc(c.wiki)}" data-q="${esc(c.flickr||"")}"
               data-photo="${esc(c.photo||"")}" data-alt="${esc(c.name)}" data-lock="${i+1}">
            <span class="fallback">${esc(c.name)}</span>
          </div>
          <figcaption>
            <p class="tagline">${esc(c.tag)}</p>
            <h3>${esc(c.name)}</h3>
            <p>${esc(c.text)}</p>
          </figcaption>
        </figure></article>`).join("")}
    </div>
  </div></section>

  <section class="band"><div class="wrap">
    <h2>Where twelve people sleep</h2>
    <p class="intro">The real choice is how many roofs you're willing to split across, and how much moving you'll accept. Rates shift, but the gap between these places is stable.</p>
    <div class="bases">
      ${d.bases.map(b=>`<div class="base"><h3>${esc(b.name)}</h3><p>${esc(b.text)}</p><p class="price">${esc(b.price)}</p></div>`).join("")}
    </div>
  </div></section>

  <section class="band dark"><div class="wrap">
    <h2>Day by day</h2>
    <p class="intro">One real thing a day, an afternoon that can collapse into a pool if it needs to, and no two hard days back to back.</p>
    <div class="days">
      ${d.itinerary.map(x=>`<div class="day">
        <div class="n">${esc(x.n)}<small>${esc(x.d)}</small></div>
        <div><h3>${esc(x.h)}</h3><p>${esc(x.p)}</p></div>
      </div>`).join("")}
    </div>
  </div></section>

  <section class="band"><div class="wrap">
    <h2>What it costs</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Line</th><th>What it covers</th><th style="text-align:right">Per person</th></tr></thead>
      <tbody>
        ${d.budget.rows.map(r=>`<tr><td><strong>${esc(r[0])}</strong></td><td>${esc(r[2])}</td><td class="num">${esc(r[1])}</td></tr>`).join("")}
        <tr class="total"><td colspan="2"><strong>${esc(d.budget.total[0])}</strong></td><td class="num">${esc(d.budget.total[1])}</td></tr>
      </tbody>
    </table></div>
    <p class="note">${esc(d.budget.note)}</p>
  </div></section>

  <section class="band dark"><div class="wrap">
    <h2>${esc(d.alt.heading)}</h2>
    <p class="intro">${esc(d.alt.intro)}</p>
    <div class="twocol">
      <div><h3>What it gets you</h3><ul>${d.alt.pro.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div><h3>What it costs you</h3><ul>${d.alt.con.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>
    <p class="intro" style="margin-top:28px">${esc(d.alt.verdict)}</p>
  </div></section>

  <section class="band"><div class="wrap">
    <h2>${esc(d.compare.heading)}</h2>
    <div class="compare">
      ${d.compare.options.map(o=>`<div class="opt${o.pick?" pick":""}"><h3>${esc(o.name)}</h3><p>${esc(o.text)}</p></div>`).join("")}
    </div>
  </div></section>`;

  const frame=p.querySelector("#gmap-"+d.id);
  p.querySelectorAll(".mbtn").forEach(b=>{
    b.addEventListener("click",()=>{
      p.querySelectorAll(".mbtn").forEach(x=>x.setAttribute("aria-pressed",x===b));
      frame.src=gmapSrc(d.gmap.q,d.gmap.z,b.dataset.type);
    });
  });
  return p;
}

function renderEmpty(){
  const p=document.createElement("div");
  p.id="panel-next";
  p.setAttribute("role","tabpanel");
  p.innerHTML=`<div class="wrap empty">
    <h2>Nothing here yet</h2>
    <p>Send the next destination report and it becomes a tab beside the others — same maps, same photo cards, same budget table, so the three families can compare like for like.</p>
  </div>`;
  return p;
}

/* tabs */
const loaded={};
function show(id){
  [...tabsEl.children].forEach(b=>b.setAttribute("aria-selected",b.dataset.id===id));
  [...panelsEl.children].forEach(x=>x.hidden=(x.id!=="panel-"+id));
  const d=DESTINATIONS.find(x=>x.id===id);
  if(d){
    const r=document.documentElement.style;
    r.setProperty("--dark",d.theme.dark);
    r.setProperty("--accent",d.theme.accent);
    r.setProperty("--sun",d.theme.sun);
    buildPinMap(d);
    if(!loaded[id]){ loaded[id]=1; loadPhotos(document.getElementById("panel-"+id)); }
  }
  window.scrollTo({top:0});
}

DESTINATIONS.forEach(d=>{
  const b=document.createElement("button");
  b.className="tab"; b.type="button"; b.setAttribute("role","tab");
  b.dataset.id=d.id; b.textContent=d.tab;
  b.setAttribute("aria-controls","panel-"+d.id);
  b.addEventListener("click",()=>show(d.id));
  tabsEl.appendChild(b);
  panelsEl.appendChild(renderPanel(d));
});

const nb=document.createElement("button");
nb.className="tab ghost"; nb.type="button"; nb.setAttribute("role","tab");
nb.dataset.id="next"; nb.textContent="Next destination";
nb.addEventListener("click",()=>show("next"));
tabsEl.appendChild(nb);
panelsEl.appendChild(renderEmpty());

show(DESTINATIONS[0].id);
</script>
